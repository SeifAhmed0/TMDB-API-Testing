<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Seif Ahmed signature logo</title>
  <desc id="desc">Readable, flowing handwritten capital S and A initials with a sweeping underline on black.</desc>
  <rect width="760" height="300" rx="16" fill="#08090A"/>
  <g fill="none" stroke="#F2EEE5" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round">
    <!-- Handwritten S: distinct upper curve, narrow middle, and open lower sweep. -->
    <path d="M382 76
      C366 61 338 57 311 64
      C282 71 269 88 277 100
      C286 114 323 116 347 119
      C373 123 384 136 375 151
      C364 171 329 184 301 180
      C284 178 278 168 284 157
      C289 148 300 142 312 137"/>
    <!-- Capital A: clear apex, two legs, and crossbar; entry and exit keep it fluid. -->
    <path d="M371 181
      C398 148 424 103 447 69
      C451 63 456 65 459 73
      C476 109 493 151 511 181
      C518 192 528 192 538 183
      C548 174 558 164 570 159"/>
    <path d="M407 143 C430 136 455 130 478 128" stroke-width="2.8"/>
    <!-- Signature underline -->
    <path d="M236 207 C320 190 419 181 520 174 C568 171 608 169 640 165" stroke-width="2.6"/>
    <path d="M613 178h10" stroke-width="3.1"/>
  </g>
  <text x="380" y="245" text-anchor="middle" fill="#F2EEE5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" letter-spacing="7">SEIF AHMED</text>
  <text x="380" y="267" text-anchor="middle" fill="#9D9A91" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="500" letter-spacing="3.1">JUNIOR SOFTWARE TEST ENGINEER</text>
</svg>
